
name: SecureGate AI - DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate-scan-and-publish:
    name: Build, Scan and Enforce Security Gate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Checkout project
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Prepare Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build container image
      - name: Build Container Image
        run: |
          docker build \
            --tag securegate-local:${{ github.sha }} \
            .

      # Step 4: Install Trivy directly
      - name: Install Trivy
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          wget -q https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.69.3_Linux-64bit.deb -O trivy.deb
          sudo dpkg -i trivy.deb
          trivy --version

      # Step 5: Scan the built container
      - name: Run Trivy Vulnerability Scanner
        run: |
          trivy image \
            --scanners vuln \
            --format json \
            --output trivy-results.json \
            securegate-local:${{ github.sha }}

      # Step 6: Save scan report even if the security gate blocks
      - name: Upload Trivy Scan Results
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json
          retention-days: 7

      # Step 7: Evaluate security policy
      - name: SecureGate AI Policy Evaluation
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)

          echo "======================================"
          echo "SecureGate AI Security Report"
          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          echo "======================================"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::SECURITY GATE BLOCKED: Critical vulnerabilities exceed zero tolerance."
            exit 1
          fi

          if [ "$HIGH" -gt 2 ]; then
            echo "::error::SECURITY GATE BLOCKED: High vulnerabilities exceed threshold of 2."
            exit 1
          fi

          echo "SECURITY GATE PASSED"

      # Step 8: Authenticate to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 9: Publish only after the gate passes
      - name: Publish Approved Container Image
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/securegate-api"

          docker tag \
            "securegate-local:${IMAGE_TAG}" \
            "${IMAGE}:${IMAGE_TAG}"

          docker push "${IMAGE}:${IMAGE_TAG}"

          echo "Approved image published:"
          echo "${IMAGE}:${IMAGE_TAG}"
