
name: SecureGate AI - Vulnerability Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerability-gate:
    name: Scan Public Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates

          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Scan NGINX Image
        run: |
          trivy image \
            --scanners vuln \
            --format json \
            --output trivy-results.json \
            nginx:stable-alpine

      - name: Upload Trivy Scan Results
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: securegate-trivy-report
          path: trivy-results.json
          retention-days: 7

      - name: SecureGate AI Policy Evaluation
        if: success()
        run: |
          if [ ! -s trivy-results.json ]; then
            echo "::error::Trivy report is missing or empty."
            exit 1
          fi

          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)

          echo "======================================"
          echo "SecureGate AI Vulnerability Report"
          echo "Image: nginx:alpine"
          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          echo "Policy: Critical = 0, High <= 2"
          echo "======================================"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::SECURITY GATE BLOCKED: Critical vulnerabilities exceed zero tolerance."
            exit 1
          fi

          if [ "$HIGH" -gt 2 ]; then
            echo "::error::SECURITY GATE BLOCKED: High vulnerabilities exceed threshold of 2."
            exit 1
          fi

          echo "SECURITY GATE PASSED"
