
name: SecureGate AI - Vulnerability Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerability-gate:
    name: Scan Public Docker Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Install Trivy directly
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.69.3_Linux-64bit.deb -O trivy.deb
          sudo dpkg -i trivy.deb
          trivy --version

      # Step 3: Scan a public Docker image
      - name: Scan NGINX Image
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --format json \
            --output trivy-results.json \
            nginx:1.14.0

      # Step 4: Ensure a scan report exists
      - name: Verify Scan Report
        if: always()
        run: |
          if [ ! -s trivy-results.json ]; then
            echo "::error::Trivy did not produce a scan report."
            exit 1
          fi

      # Step 5: Upload scan report
      - name: Upload Trivy Scan Results
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: securegate-trivy-report
          path: trivy-results.json
          retention-days: 7

      # Step 6: Enforce SecureGate policy
      - name: SecureGate AI Policy Evaluation
        if: always() && hashFiles('trivy-results.json') != ''
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)

          echo "======================================"
          echo "SecureGate AI Vulnerability Report"
          echo "Image: nginx:1.14.0"
          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          echo "Policy: Critical = 0, High <= 2"
          echo "======================================"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::SECURITY GATE BLOCKED: Critical vulnerabilities exceed zero tolerance."
            exit 1
          fi

          if [ "$HIGH" -gt 2 ]; then
            echo "::error::SECURITY GATE BLOCKED: High vulnerabilities exceed threshold of 2."
            exit 1
          fi

          echo "SECURITY GATE PASSED"
