
name: SecureGate AI - DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate-scan-and-publish:
    name: Build, Scan and Enforce Security Gate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        run: |
          docker build \
            -t securegate-local:${{ github.sha }} \
            .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.4
        with:
          version: latest

      - name: Run Trivy Vulnerability Scanner
        run: |
          trivy image \
            --scanners vuln \
            --format json \
            --output trivy-results.json \
            securegate-local:${{ github.sha }}

      - name: Upload Trivy Scan Results
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json
          retention-days: 7

      - name: SecureGate AI Policy Evaluation
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)

          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::SECURITY GATE BLOCKED: Critical vulnerabilities exceed zero tolerance."
            exit 1
          fi

          if [ "$HIGH" -gt 2 ]; then
            echo "::error::SECURITY GATE BLOCKED: High vulnerabilities exceed threshold of 2."
            exit 1
          fi

          echo "SECURITY GATE PASSED"

      - name: Log in to GitHub Container Registry
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Approved Container Image
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/securegate-api"

          docker tag "securegate-local:${IMAGE_TAG}" "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${IMAGE_TAG}"

          echo "Approved image published: ${IMAGE}:${IMAGE_TAG}"
